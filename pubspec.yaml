name: test_login
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: any
  get_it: any
  injectable: any
  freezed_annotation: any
  json_annotation: any
  dartz: any
  dio: any
  http: any
  google_sign_in: ^6.2.1
  path: any
  path_provider: any
  shared_preferences: any
  flutter_secure_storage: any
  sqflite: any
  url_launcher: any
  flutter_svg: any
  flutter_screenutil: any
  dotted_border: any
  intl: any
  image_picker: any
  readmore: any
  dotted_line: any
  pinput: any
  # drift: any
  # sqlite3_flutter_libs: any
  flutter_dotenv: any
  go_router: any
  pdf: any
  printing: any
  image_gallery_saver_plus: ^4.0.1
  get: ^4.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  # drift_dev: any
  build_runner: any
  injectable_generator: any
  freezed: any
  json_serializable: any

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/data/
  fonts:
    - family: Gilroy
      fonts:
        - asset: fonts/Gilroy-Bold.ttf
          weight: 700
        - asset: fonts/Gilroy-Regular.ttf
          weight: 400
        - asset: fonts/Gilroy-SemiBold.ttf
          weight: 600
        - asset: fonts/Gilroy-Medium.ttf
          weight: 500

