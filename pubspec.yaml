name: test_login
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.2
  http: ^1.2.1
  google_sign_in: ^7.2.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2
  url_launcher: ^6.3.2
  get: ^4.7.3
  flutter_svg: ^2.2.4
  flutter_screenutil: ^5.9.3
  dotted_border: ^3.1.0
  intl: ^0.20.2
  image_picker: ^1.2.1
  readmore: ^3.0.0
  dotted_line: ^3.2.3
  pinput: ^6.0.2
  drift: ^2.32.1
  sqlite3_flutter_libs: ^0.6.0+eol
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.1
  build_runner: ^2.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/conferences.json
  fonts:
    - family: Gilroy
      fonts:
        - asset: fonts/Gilroy-Bold.ttf
          weight: 700
        - asset: fonts/Gilroy-Regular.ttf
          weight: 400
        - asset: fonts/Gilroy-SemiBold.ttf
          weight: 600
        - asset: fonts/Gilroy-Medium.ttf
          weight: 500

